<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bedtime Story Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .loader {
      border-top-color: #3b82f6;
      animation: spinner 1.5s linear infinite;
    }
    @keyframes spinner {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen py-10 px-4 flex justify-center items-center">

  <div class="max-w-2xl w-full bg-slate-800 rounded-2xl shadow-xl p-6 sm:p-10 border border-slate-700">
    <!-- Header -->
    <header class="text-center mb-8">
      <h1 class="text-3xl font-bold text-indigo-400 mb-2">✨ Bedtime Story Generator</h1>
      <p class="text-slate-400 text-sm">Create a personalized, cozy adventure for bedtime.</p>
    </header>

    <!-- Story Generator Form -->
    <form id="storyForm" onsubmit="event.preventDefault(); window.generateAIStory();" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1" for="heroName">Hero's Name</label>
        <input 
          type="text" 
          id="heroName" 
          placeholder="e.g., Leo" 
          class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1" for="theme">Topic / Theme</label>
        <input 
          type="text" 
          id="theme" 
          placeholder="e.g., Space exploration, talking animals, secret garden" 
          class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1" for="keyPoints">Key Plot Details</label>
        <textarea 
          id="keyPoints" 
          rows="2" 
          placeholder="e.g., Finding a lost puppy, building a treehouse" 
          class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        ></textarea>
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1" for="bibleVerse">Guiding Bible Verse / Moral</label>
        <input 
          type="text" 
          id="bibleVerse" 
          placeholder="e.g., Psalm 4:8 or Courage" 
          class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1" for="mood">Overall Mood</label>
        <select 
          id="mood" 
          class="w-full bg-slate-700 border border-slate-600 rounded-lg px-4 py-2 text-white focus:outline-none focus:ring-2 focus:ring-indigo-500"
        >
          <option value="Peaceful and Calming">Peaceful & Calming</option>
          <option value="Whimsical and Cozy">Whimsical & Cozy</option>
          <option value="Gentle Adventure">Gentle Adventure</option>
        </select>
      </div>

      <button 
        type="submit" 
        id="generateBtn" 
        class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-3 px-6 rounded-lg shadow-lg transition duration-200 mt-6"
      >
        Create Bedtime Story 🌙
      </button>
    </form>

    <!-- Loading State -->
    <div id="loading" class="hidden text-center py-8">
      <div class="loader ease-linear rounded-full border-4 border-t-4 border-gray-600 h-10 w-10 mx-auto mb-4"></div>
      <p class="text-slate-400 text-sm">Tucking the stars in and dreaming up a story...</p>
    </div>

    <!-- Output Story Card -->
    <div id="storyCard" class="hidden mt-8 pt-6 border-t border-slate-700">
      <h2 class="text-xl font-bold text-indigo-300 mb-4">📖 Tonight's Story</h2>
      <div id="storyText" class="text-slate-200 leading-relaxed whitespace-pre-wrap space-y-4"></div>
    </div>
  </div>

  <!-- Import Map for Google Gen AI SDK -->
  <script type="importmap">
    {
      "imports": {
        "@google/genai": "https://esm.run/@google/genai"
      }
    }
  </script>

  <!-- Main Application Logic -->
  <script type="module">
    import { GoogleGenAI } from "@google/genai";

    // Insert your AQ... API key here
    const GEMINI_API_KEY = "AQ.Ab8RN6JAuoY_eYk6ci8rgqi6uvObZSZJAjPJi2z4D-uBNwSLbA";

    // Initialize the client
    const ai = new GoogleGenAI({ apiKey: GEMINI_API_KEY });

    // Expose generator function globally to be triggered by form submit
    window.generateAIStory = async function() {
      const name = document.getElementById('heroName').value.trim() || "Brave Explorer";
      const theme = document.getElementById('theme').value.trim() || "an exciting adventure";
      const points = document.getElementById('keyPoints').value.trim() || "discovering something wonderful";
      const verse = document.getElementById('bibleVerse').value.trim() || "Psalm 4:8";
      const mood = document.getElementById('mood').value;

      const btn = document.getElementById('generateBtn');
      const loader = document.getElementById('loading');
      const storyCard = document.getElementById('storyCard');
      const storyText = document.getElementById('storyText');

      btn.disabled = true;
      btn.classList.add('opacity-50', 'cursor-not-allowed');
      loader.classList.remove('hidden');
      storyCard.classList.add('hidden');

      const prompt = `You are a warm, imaginative children's book author writing a bedtime story for a 4-year-old boy. 
Write a complete, beautifully flowing narrative based on these parameters:
- Main Character / Hero: ${name}
- Topic / Theme: ${theme}
- Key Plot Elements to weave organically into the plot: ${points}
- Guiding Bible Verse / Moral to naturally inspire the story's lesson: ${verse}
- Overall Mood: ${mood}

Instructions:
1. DO NOT explicitly state things like "the theme is..." or output meta-commentary. Seamlessly weave the plot points and the message of the Bible verse naturally into the narrative events and character actions.
2. Keep the language age-appropriate, engaging, and comforting.
3. Conclude the story smoothly, transitioning into a peaceful, sleepy wind-down for bedtime so the child is ready to sleep.`;

      try {
        const response = await ai.models.generateContent({
          model: 'gemini-2.5-flash',
          contents: prompt,
        });

        storyText.innerText = response.text;
        storyCard.classList.remove('hidden');
        storyCard.scrollIntoView({ behavior: 'smooth' });
      } catch (err) {
        console.error(err);
        alert("Error generating story: " + err.message);
      } finally {
        btn.disabled = false;
        btn.classList.remove('opacity-50', 'cursor-not-allowed');
        loader.classList.add('hidden');
      }
    };
  </script>
</body>
</html>
