<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedtime Story Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .story-output {
            line-height: 1.8;
            font-size: 1.1rem;
            white-space: pre-wrap;
        }

        .hidden {
            display: none;
        }

        .verse-callout {
            font-style: italic;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 12px 16px;
            border-left: 4px solid var(--accent-color);
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌙 Bedtime Story Generator</h1>
        
        <div class="card">
            <div class="form-group">
                <label for="heroName">Hero Name</label>
                <input type="text" id="heroName" placeholder="e.g., George">
            </div>

            <div class="form-group">
                <label for="theme">Topic / Theme</label>
                <input type="text" id="theme" placeholder="e.g., A brave knight protecting his family">
            </div>

            <div class="form-group">
                <label for="keyPoints">Key Story Points / Ideas</label>
                <textarea id="keyPoints" placeholder="e.g., Climbs a mountain, faces a playground challenge"></textarea>
            </div>

            <div class="form-group">
                <label for="bibleVerse">Bible Verse (Moral / Lesson)</label>
                <input type="text" id="bibleVerse" placeholder="e.g., Ephesians 6:11 or Joshua 1:9">
            </div>

            <div class="form-group">
                <label for="mood">Mood</label>
                <select id="mood">
                    <option value="calming">Calming & Sleepy</option>
                    <option value="exciting">Fun & Adventurous</option>
                    <option value="silly">Silly & Playful</option>
                </select>
            </div>

            <button onclick="generateStory()">Generate Full Story</button>
        </div>

        <div id="storyCard" class="card hidden">
            <div id="verseDisplay" class="verse-callout hidden"></div>
            <h3 style="margin-top: 0; color: var(--accent-color);">📖 Bedtime Adventure</h3>
            <div id="storyText" class="story-output"></div>
        </div>
    </div>

    <script>
        const verseDatabase = {
            "ephesians 6:11": {
                ref: "Ephesians 6:11",
                text: "Put on the full armor of God, so that you can take your stand against the devil's schemes.",
                actualText: true,
                narrativeIntegration: (name) => `putting on invisible armor of truth and goodness, standing tall and steady with a protected heart`
            },
            "joshua 1:9": {
                ref: "Joshua 1:9",
                text: "Be strong and courageous... for the Lord your God will be with you wherever you go.",
                actualText: true,
                narrativeIntegration: (name) => `feeling completely brave because he knew he was never alone on his journey`
            },
            "psalm 4:8": {
                ref: "Psalm 4:8",
                text: "In peace I will lie down and sleep, for you alone, Lord, make me dwell in safety.",
                actualText: true,
                narrativeIntegration: (name) => `resting in the quiet safety and cozy peace of God's watchful care`
            },
            "proverbs 3:5": {
                ref: "Proverbs 3:5",
                text: "Trust in the Lord with all your heart and lean not on your own understanding.",
                actualText: true,
                narrativeIntegration: (name) => `trusting step-by-step down the right path with complete confidence`
            }
        };

        function generateStory() {
            const name = document.getElementById('heroName').value.trim() || "Brave Explorer";
            const theme = document.getElementById('theme').value.trim() || "an exciting quest";
            const points = document.getElementById('keyPoints').value.trim() || "embarks on a noble adventure to help others";
            const rawVerseInput = document.getElementById('bibleVerse').value.trim().toLowerCase();
            const mood = document.getElementById('mood').value;

            let selectedVerse = verseDatabase[rawVerseInput];
            if (!selectedVerse && rawVerseInput !== "") {
                // Intelligent cleaner for custom-typed verses
                let customRef = document.getElementById('bibleVerse').value.trim();
                selectedVerse = {
                    ref: customRef,
                    text: `A guiding light of wisdom and truth from ${customRef}.`,
                    actualText: false,
                    narrativeIntegration: () => `walking forward with a heart full of faith and strength`
                };
            }

            // Natural, flowing story structure tailored to read like a real book
            let story = `Once upon a time, in a bright and peaceful land, lived a wonderful hero named ${name}. ${name} had a warm, loving heart and was always ready to look out for the people he cared about most.\n\n`;
            
            story += `Tonight, a special adventure began. The theme of the journey was ${theme}, and it all started when ${name} faced a big moment: ${points}.\n\n`;

            if (selectedVerse) {
                let integrationText = selectedVerse.narrativeIntegration(name);
                story += `At first, the challenge looked big, but ${name} took a deep breath, remembered the words of ${selectedVerse.ref}, and imagined himself ${integrationText}.\n\n`;
            }

            story += `With clever ideas and a gentle, steady spirit, ${name} navigated right through the challenge. Every step he took brought more light, laughter, and goodness to the adventure.\n\n`;

            if (mood === 'calming') {
                story += `As the adventure gently came to a close, a soft, sleepy evening breeze rolled through the trees. The stars blinked overhead like little night-lights, wrapping the whole world in deep, quiet peace.\n\n`;
            } else if (mood === 'exciting') {
                story += `With a triumphant smile and a joyful cheer, ${name} successfully completed the quest, saving the day with courage and a happy heart!\n\n`;
            } else {
                story += `With a few playful giggles and lighthearted steps, ${name} wrapped up the journey in the most fun way imaginable.\n\n`;
            }

            story += `With a proud, happy heart and a job well done, our hero climbed into his warm, cozy bed. The moon shone softly through his window, keeping watch over his sleep.\n\nGoodnight, ${name}. Sweet dreams.`;

            // Display verse block cleanly
            const verseDisplay = document.getElementById('verseDisplay');
            if (rawVerseInput !== "" && selectedVerse) {
                verseDisplay.innerHTML = `<strong>"${selectedVerse.text}"</strong> — <em>${selectedVerse.ref}</em>`;
                verseDisplay.classList.remove('hidden');
            } else {
                verseDisplay.classList.add('hidden');
            }

            document.getElementById('storyText').innerText = story;
            document.getElementById('storyCard').classList.remove('hidden');
            document.getElementById('storyCard').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
