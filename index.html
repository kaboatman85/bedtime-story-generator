<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedtime Story Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .story-output {
            line-height: 1.6;
            font-size: 1.1rem;
            white-space: pre-wrap;
        }

        .hidden {
            display: none;
        }

        .verse-callout {
            font-style: italic;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 10px 14px;
            border-left: 4px solid var(--accent-color);
            border-radius: 0 8px 8px 0;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌙 Bedtime Story Generator</h1>
        
        <div class="card">
            <div class="form-group">
                <label for="heroName">Hero Name</label>
                <input type="text" id="heroName" placeholder="e.g., Leo">
            </div>

            <div class="form-group">
                <label for="theme">Topic / Theme</label>
                <input type="text" id="theme" placeholder="e.g., Brave knight defending the castle or flying superhero">
            </div>

            <div class="form-group">
                <label for="keyPoints">Key Story Points</label>
                <textarea id="keyPoints" placeholder="e.g., Finds a glowing shield, helps a lost dragon find its way home"></textarea>
            </div>

            <div class="form-group">
                <label for="bibleVerse">Bible Verse (Moral / Lesson)</label>
                <input type="text" id="bibleVerse" placeholder="e.g., Joshua 1:9 or Psalm 4:8">
            </div>

            <div class="form-group">
                <label for="mood">Mood</label>
                <select id="mood">
                    <option value="calming">Calming & Sleepy</option>
                    <option value="exciting">Fun & Adventurous</option>
                    <option value="silly">Silly & Playful</option>
                </select>
            </div>

            <div class="form-group">
                <label for="length">Length</label>
                <select id="length">
                    <option value="short">Short (Quick read)</option>
                    <option value="medium" selected>Medium (Standard bedtime story)</option>
                </select>
            </div>

            <button onclick="generateStory()">Generate Story</button>
        </div>

        <div id="storyCard" class="card hidden">
            <div id="verseDisplay" class="verse-callout hidden"></div>
            <h3 style="margin-top: 0; color: var(--accent-color);">Your Custom Story</h3>
            <div id="storyText" class="story-output"></div>
        </div>
    </div>

    <script>
        // A built-in mini library of common verses for instant matching, 
        // with a fallback structure for custom references.
        const verseDatabase = {
            "joshua 1:9": {
                ref: "Joshua 1:9",
                text: "Be strong and courageous... for the Lord your God will be with you wherever you go.",
                themeText: "courage, knowing that he is never alone because bravery comes from a protected heart."
            },
            "psalm 4:8": {
                ref: "Psalm 4:8",
                text: "In peace I will lie down and sleep, for you alone, Lord, make me dwell in safety.",
                themeText: "peaceful rest, safety, and cozy slumber under God's watchful eye."
            },
            "proverbs 3:5": {
                ref: "Proverbs 3:5",
                text: "Trust in the Lord with all your heart and lean not on your own understanding.",
                themeText: "trust, guidance, and following the right path even when things look confusing."
            },
            "1 corinthians 16:14": {
                ref: "1 Corinthians 16:14",
                text: "Do everything in love.",
                themeText: "acting with kindness, gentle love, and helping neighbors."
            }
        };

        function generateStory() {
            const name = document.getElementById('heroName').value.trim() || "Brave Explorer";
            const theme = document.getElementById('theme').value.trim() || "a magical knight and superhero adventure";
            const points = document.getElementById('keyPoints').value.trim() || "discovering a glowing shield and helping a friend";
            const rawVerseInput = document.getElementById('bibleVerse').value.trim().toLowerCase();
            const mood = document.getElementById('mood').value;

            // Check if verse matches our lookup database or create a generalized adaptation
            let selectedVerse = verseDatabase[rawVerseInput];
            
            if (!selectedVerse && rawVerseInput !== "") {
                // Fallback for custom entered verses
                selectedVerse = {
                    ref: document.getElementById('bibleVerse').value.trim(),
                    text: "A special guiding light of truth and wisdom.",
                    themeText: "faith, goodness, and growing with a strong heart."
                };
            }

            // Build the story text incorporating the verse's underlying theme
            let story = `Once upon a time, in a bright and cozy kingdom, lived a wonderful hero named ${name}.\n\n`;
            story += `${name} loved stories about ${theme}. Tonight, a special adventure began when ${points}.\n\n`;

            if (selectedVerse) {
                story += `During the journey, ${name} remembered the special promise of ${selectedVerse.ref}, learning all about ${selectedVerse.themeText}.\n\n`;
            }

            if (mood === 'calming') {
                story += `With every step, the air grew softer and the stars twinkled a little brighter, wrapping the adventure in a warm, peaceful glow.\n\n`;
            } else {
                story += `With a heroic cheer, ${name} faced the challenge with a big smile and a brave heart!\n\n`;
            }

            story += `As the moon climbed high into the sky, our hero settled down for a deep, restful sleep, safe and sound.\n\nGoodnight, ${name}. Sweet dreams.`;

            // Display the verse callout block if a verse was given
            const verseDisplay = document.getElementById('verseDisplay');
            if (rawVerseInput !== "" && selectedVerse) {
                verseDisplay.innerHTML = `<strong>"${selectedVerse.text}"</strong> — <em>${selectedVerse.ref}</em>`;
                verseDisplay.classList.remove('hidden');
            } else {
                verseDisplay.classList.add('hidden');
            }

            document.getElementById('storyText').innerText = story;
            document.getElementById('storyCard').classList.remove('hidden');
            document.getElementById('storyCard').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
