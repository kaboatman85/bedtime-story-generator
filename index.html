<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Bedtime Story Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:disabled {
            background-color: #475569;
            cursor: not-allowed;
        }

        .story-output {
            line-height: 1.8;
            font-size: 1.1rem;
            white-space: pre-wrap;
        }

        .hidden {
            display: none;
        }

        .loader {
            text-align: center;
            color: var(--accent-color);
            font-style: italic;
            margin: 20px 0;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌙 AI Bedtime Story Generator</h1>
        
        <div class="card">
            <div class="form-group">
                <label for="heroName">Hero Name</label>
                <input type="text" id="heroName" placeholder="e.g., Joshua">
            </div>

            <div class="form-group">
                <label for="theme">Topic / Theme</label>
                <input type="text" id="theme" placeholder="e.g., A boy starting at a new school">
            </div>

            <div class="form-group">
                <label for="keyPoints">Key Story Points / Ideas</label>
                <textarea id="keyPoints" placeholder="e.g., Making new friends, learning new things"></textarea>
            </div>

            <div class="form-group">
                <label for="bibleVerse">Bible Verse (Moral / Lesson)</label>
                <input type="text" id="bibleVerse" placeholder="e.g., Psalm 56:3-4">
            </div>

            <div class="form-group">
                <label for="mood">Mood</label>
                <select id="mood">
                    <option value="calming and sleepy">Calming & Sleepy</option>
                    <option value="fun and adventurous">Fun & Adventurous</option>
                    <option value="silly and playful">Silly & Playful</option>
                </select>
            </div>

            <button id="generateBtn" onclick="generateAIStory()">Generate AI Story</button>
        </div>

        <div id="loading" class="loader hidden">✨ Crafting a magical story...</div>

        <div id="storyCard" class="card hidden">
            <h3 style="margin-top: 0; color: var(--accent-color);">📖 Bedtime Adventure</h3>
            <div id="storyText" class="story-output"></div>
        </div>
    </div>

    <script>
        // HARDCODE YOUR API KEY HERE AS A STRING IN QUOTES:
        const GEMINI_API_KEY = "AQ.Ab8RN6JtOlHNb8B-zKK0-Fy4ZFXZasw5rFefm4yjapYTSP1n9A";

        async function generateAIStory() {
            if (!GEMINI_API_KEY || GEMINI_API_KEY === "YOUR_GEMINI_API_KEY_HERE") {
                alert("Please enter a valid API key in the GEMINI_API_KEY variable.");
                return;
            }

            const name = document.getElementById('heroName').value.trim() || "Brave Explorer";
            const theme = document.getElementById('theme').value.trim() || "an exciting adventure";
            const points = document.getElementById('keyPoints').value.trim() || "discovering something wonderful";
            const verse = document.getElementById('bibleVerse').value.trim() || "Psalm 4:8";
            const mood = document.getElementById('mood').value;

            const btn = document.getElementById('generateBtn');
            const loader = document.getElementById('loading');
            const storyCard = document.getElementById('storyCard');
            const storyText = document.getElementById('storyText');

            btn.disabled = true;
            loader.classList.remove('hidden');
            storyCard.classList.add('hidden');

            const prompt = `You are a warm, imaginative children's book author writing a bedtime story for a 4-year-old boy. 
Write a complete, beautifully flowing narrative based on these parameters:
- Main Character / Hero: ${name}
- Topic / Theme: ${theme}
- Key Plot Elements to weave organically into the plot: ${points}
- Guiding Bible Verse / Moral to naturally inspire the story's lesson: ${verse}
- Overall Mood: ${mood}

Instructions:
1. DO NOT explicitly state things like "the theme is..." or output meta-commentary. Seamlessly weave the plot points and the message of the Bible verse naturally into the narrative events and character actions.
2. Keep the language age-appropriate, engaging, and comforting.
3. Conclude the story smoothly, transitioning into a peaceful, sleepy wind-down for bedtime so the child is ready to sleep.`;

            try {
                // Sent properly via the 'x-goog-api-key' request header
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent`, {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json',
                        'x-goog-api-key': GEMINI_API_KEY
                    },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }]
                    })
                });

                const data = await response.json();
                
                if (data.error) {
                    throw new Error(data.error.message);
                }

                const generatedText = data.candidates[0].content.parts[0].text;
                
                storyText.innerText = generatedText;
                storyCard.classList.remove('hidden');
                storyCard.scrollIntoView({ behavior: 'smooth' });

            } catch (err) {
                alert("Error generating story: " + err.message);
            } finally {
                btn.disabled = false;
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
