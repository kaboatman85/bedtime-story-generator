<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedtime Story Cliff Notes</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .output-section {
            line-height: 1.6;
            font-size: 1.05rem;
        }

        .output-section h4 {
            color: var(--accent-color);
            margin-bottom: 8px;
            margin-top: 16px;
        }

        .output-section ul {
            margin-top: 4px;
            padding-left: 20px;
        }

        .output-section li {
            margin-bottom: 8px;
        }

        .hidden {
            display: none;
        }

        .verse-callout {
            font-style: italic;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 10px 14px;
            border-left: 4px solid var(--accent-color);
            border-radius: 0 8px 8px 0;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌙 Bedtime Story Cliff Notes</h1>
        
        <div class="card">
            <div class="form-group">
                <label for="heroName">Hero Name</label>
                <input type="text" id="heroName" placeholder="e.g., Leo">
            </div>

            <div class="form-group">
                <label for="theme">Topic / Theme</label>
                <input type="text" id="theme" placeholder="e.g., Brave knight defending the castle or flying superhero">
            </div>

            <div class="form-group">
                <label for="keyPoints">Key Story Points / Ideas</label>
                <textarea id="keyPoints" placeholder="e.g., Finds a glowing shield, helps a lost dragon find its way home"></textarea>
            </div>

            <div class="form-group">
                <label for="bibleVerse">Bible Verse (Moral / Lesson)</label>
                <input type="text" id="bibleVerse" placeholder="e.g., Joshua 1:9 or Psalm 4:8">
            </div>

            <div class="form-group">
                <label for="mood">Mood</label>
                <select id="mood">
                    <option value="calming">Calming & Sleepy</option>
                    <option value="exciting">Fun & Adventurous</option>
                    <option value="silly">Silly & Playful</option>
                </select>
            </div>

            <button onclick="generateCliffNotes()">Generate Cliff Notes</button>
        </div>

        <div id="notesCard" class="card hidden">
            <div id="verseDisplay" class="verse-callout hidden"></div>
            
            <div class="output-section">
                <h3 style="margin-top: 0; color: var(--accent-color);">📖 Story Outline</h3>
                
                <h4>High-Level Summary</h4>
                <p id="summaryText"></p>

                <h4>3 Key Story Ideas (Your Roadmap)</h4>
                <ul id="ideasText"></ul>
            </div>
        </div>
    </div>

    <script>
        const verseDatabase = {
            "joshua 1:9": {
                ref: "Joshua 1:9",
                text: "Be strong and courageous... for the Lord your God will be with you wherever you go.",
                themeWord: "courage and knowing he is never alone"
            },
            "psalm 4:8": {
                ref: "Psalm 4:8",
                text: "In peace I will lie down and sleep, for you alone, Lord, make me dwell in safety.",
                themeWord: "peaceful rest and safety under God's watchful eye"
            },
            "proverbs 3:5": {
                ref: "Proverbs 3:5",
                text: "Trust in the Lord with all your heart and lean not on your own understanding.",
                themeWord: "trust and following guidance when things are tricky"
            },
            "1 corinthians 16:14": {
                ref: "1 Corinthians 16:14",
                text: "Do everything in love.",
                themeWord: "acting with kindness and gentle love"
            }
        };

        function generateCliffNotes() {
            const name = document.getElementById('heroName').value.trim() || "Brave Explorer";
            const theme = document.getElementById('theme').value.trim() || "a magical knight and superhero adventure";
            const points = document.getElementById('keyPoints').value.trim() || "discovering a glowing tool and helping a friend";
            const rawVerseInput = document.getElementById('bibleVerse').value.trim().toLowerCase();
            const mood = document.getElementById('mood').value;

            let selectedVerse = verseDatabase[rawVerseInput];
            if (!selectedVerse && rawVerseInput !== "") {
                selectedVerse = {
                    ref: document.getElementById('bibleVerse').value.trim(),
                    text: "A guiding light of truth and wisdom.",
                    themeWord: "faith and growing with a strong heart"
                };
            }

            // Build high-level summary
            let summary = `A ${mood} adventure starring ${name} as they explore ${theme}. `;
            if (selectedVerse) {
                summary += `The journey centers around the theme of ${selectedVerse.themeWord}, tying into ${selectedVerse.ref}.`;
            } else {
                summary += `The adventure focuses on ${points}.`;
            }

            // Build 3 key ideas/cliff notes
            let idea1 = `<strong>Beginning:</strong> Introduce ${name} in their setting. Set off on the mission involving ${theme}, keeping the mood ${mood}.`;
            let idea2 = `<strong>Middle (The Challenge):</strong> Incorporate the key plot point (${points}) where ${name} faces a small hurdle or puzzle.`;
            let idea3 = `<strong>Ending & Wind-Down:</strong> Connect the resolution back to ${selectedVerse ? selectedVerse.ref : 'the day\'s lesson'} and guide ${name} smoothly toward a sleepy, cozy bedtime.`;

            // Display verse callout
            const verseDisplay = document.getElementById('verseDisplay');
            if (rawVerseInput !== "" && selectedVerse) {
                verseDisplay.innerHTML = `<strong>"${selectedVerse.text}"</strong> — <em>${selectedVerse.ref}</em>`;
                verseDisplay.classList.remove('hidden');
            } else {
                verseDisplay.classList.add('hidden');
            }

            // Render output
            document.getElementById('summaryText').innerText = summary;
            document.getElementById('ideasText').innerHTML = `<li>${idea1}</li><li>${idea2}</li><li>${idea3}</li>`;
            
            document.getElementById('notesCard').classList.remove('hidden');
            document.getElementById('notesCard').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
