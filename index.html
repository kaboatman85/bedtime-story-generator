<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bedtime Story Generator</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-hover: #0ea5e9;
            --border-color: #334155;
        }

        body {
            font-family: system-ui, -apple-system, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 650px;
        }

        h1 {
            text-align: center;
            color: var(--accent-color);
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 0.9rem;
            color: #cbd5e1;
        }

        input[type="text"], textarea, select {
            width: 100%;
            padding: 10px 12px;
            background-color: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 1rem;
            box-sizing: border-box;
        }

        input[type="text"]:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        textarea {
            resize: vertical;
            height: 80px;
        }

        button {
            width: 100%;
            background-color: var(--accent-color);
            color: #0f172a;
            border: none;
            border-radius: 8px;
            padding: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .story-output {
            line-height: 1.7;
            font-size: 1.05rem;
            white-space: pre-wrap;
        }

        .hidden {
            display: none;
        }

        .verse-callout {
            font-style: italic;
            color: #38bdf8;
            background: rgba(56, 189, 248, 0.1);
            padding: 12px 16px;
            border-left: 4px solid var(--accent-color);
            border-radius: 0 8px 8px 0;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>🌙 Bedtime Story Generator</h1>
        
        <div class="card">
            <div class="form-group">
                <label for="heroName">Hero Name</label>
                <input type="text" id="heroName" placeholder="e.g., Leo">
            </div>

            <div class="form-group">
                <label for="theme">Topic / Theme</label>
                <input type="text" id="theme" placeholder="e.g., A knight fighting for his family">
            </div>

            <div class="form-group">
                <label for="keyPoints">Key Story Points / Ideas</label>
                <textarea id="keyPoints" placeholder="e.g., Sister kidnapped by a bad guy, dragon that breathes ice"></textarea>
            </div>

            <div class="form-group">
                <label for="bibleVerse">Bible Verse (Moral / Lesson)</label>
                <input type="text" id="bibleVerse" placeholder="e.g., Joshua 1:9 or Psalm 4:8">
            </div>

            <div class="form-group">
                <label for="mood">Mood</label>
                <select id="mood">
                    <option value="calming">Calming & Sleepy</option>
                    <option value="exciting">Fun & Adventurous</option>
                    <option value="silly">Silly & Playful</option>
                </select>
            </div>

            <button onclick="generateStory()">Generate Full Story</button>
        </div>

        <div id="storyCard" class="card hidden">
            <div id="verseDisplay" class="verse-callout hidden"></div>
            <h3 style="margin-top: 0; color: var(--accent-color);">📖 Bedtime Adventure</h3>
            <div id="storyText" class="story-output"></div>
        </div>
    </div>

    <script>
        const verseDatabase = {
            "joshua 1:9": {
                ref: "Joshua 1:9",
                text: "Be strong and courageous... for the Lord your God will be with you wherever you go.",
                lessonPhrase: "brave and strong, remembering that he is never alone"
            },
            "psalm 4:8": {
                ref: "Psalm 4:8",
                text: "In peace I will lie down and sleep, for you alone, Lord, make me dwell in safety.",
                lessonPhrase: "peaceful rest and safety under God's watchful care"
            },
            "proverbs 3:5": {
                ref: "Proverbs 3:5",
                text: "Trust in the Lord with all your heart and lean not on your own understanding.",
                lessonPhrase: "trusting completely and following the right path"
            },
            "1 corinthians 16:14": {
                ref: "1 Corinthians 16:14",
                text: "Do everything in love.",
                lessonPhrase: "acting with fierce love and kindness"
            }
        };

        function generateStory() {
            const name = document.getElementById('heroName').value.trim() || "Brave Explorer";
            const theme = document.getElementById('theme').value.trim() || "a heroic journey";
            const points = document.getElementById('keyPoints').value.trim() || "facing a great challenge to protect what matters most";
            const rawVerseInput = document.getElementById('bibleVerse').value.trim().toLowerCase();
            const mood = document.getElementById('mood').value;

            let selectedVerse = verseDatabase[rawVerseInput];
            if (!selectedVerse && rawVerseInput !== "") {
                selectedVerse = {
                    ref: document.getElementById('bibleVerse').value.trim(),
                    text: "A guiding light of truth and wisdom.",
                    lessonPhrase: "faith, love, and growing with a strong heart"
                };
            }

            // Crafting a detailed, rich story layout
            let story = `Once upon a time, in a bright and peaceful land, lived a brave knight named ${name}. ${name} was known far and wide for having a heart full of love, especially when it came to protecting his family.\n\n`;
            
            story += `Tonight's adventure was a special one about ${theme}. The kingdom was quiet until a sudden challenge arose: ${points}.\n\n`;

            if (selectedVerse) {
                story += `Even though things felt uncertain for a moment, ${name} placed his hand over his heart and remembered the promise of ${selectedVerse.ref}. He knew he didn't have to be afraid, because he was ${selectedVerse.lessonPhrase}.\n\n`;
            }

            story += `With renewed courage, ${name} stepped forward into the cool evening air. He used cleverness, kindness, and steady steps to navigate through every twist of the journey, turning every obstacle into a moment of triumph.\n\n`;

            if (mood === 'calming') {
                story += `As the adventure safely concluded and everything was set right, a gentle, sleepy breeze swept through the trees. The stars began to blink like sleepy eyes, wrapping the whole world in a blanket of quiet peace.\n\n`;
            } else if (mood === 'exciting') {
                story += `With a triumphant cheer and a big smile, ${name} successfully completed the mission, saving the day with courage and joy!\n\n`;
            } else {
                story += `With a few giggles and playful maneuvers, ${name} wrapped up the adventure in the most fun way possible.\n\n`;
            }

            story += `With a happy heart and a job well done, our hero settled down into his cozy bed. The moon shone softly through the window, guarding his sleep.\n\nGoodnight, ${name}. Sweet dreams.`;

            // Display verse block if provided
            const verseDisplay = document.getElementById('verseDisplay');
            if (rawVerseInput !== "" && selectedVerse) {
                verseDisplay.innerHTML = `<strong>"${selectedVerse.text}"</strong> — <em>${selectedVerse.ref}</em>`;
                verseDisplay.classList.remove('hidden');
            } else {
                verseDisplay.classList.add('hidden');
            }

            document.getElementById('storyText').innerText = story;
            document.getElementById('storyCard').classList.remove('hidden');
            document.getElementById('storyCard').scrollIntoView({ behavior: 'smooth' });
        }
    </script>
</body>
</html>
